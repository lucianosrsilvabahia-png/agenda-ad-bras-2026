<script>
let deferredPrompt;
const installBtn = document.getElementById("installBtn");

// Esconde o botão por padrão
installBtn.hidden = true;

// Verifica se o aplicativo já está instalado
function isAppInstalled() {
    return window.matchMedia("(display-mode: standalone)").matches ||
           window.navigator.standalone === true;
}

// Se já estiver instalado, mantém o botão escondido
if (isAppInstalled()) {
    installBtn.hidden = true;
}

// Quando o navegador disponibilizar a instalação
window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;

    // Só mostra se ainda não estiver instalado
    if (!isAppInstalled()) {
        installBtn.hidden = false;
    }
});

// Clique no botão instalar
installBtn.addEventListener("click", async () => {
    if (!deferredPrompt) return;

    deferredPrompt.prompt();

    const { outcome } = await deferredPrompt.userChoice;

    deferredPrompt = null;

    // Se instalou ou dispensou, esconde o botão
    installBtn.hidden = true;
});

// Quando a instalação for concluída
window.addEventListener("appinstalled", () => {
    deferredPrompt = null;
    installBtn.hidden = true;
});
</script>
